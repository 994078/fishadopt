name: Build Android APK

# 在 Linux (ubuntu-latest) 上自动完成：arm64 RootFS 构建 → 资产打包 → APK 编译 → 签名
# 触发：仓库 Actions 页手动触发（workflow_dispatch），填入 DSH 仓库与 proot-rs 下载地址。
on:
  workflow_dispatch:
    inputs:
      dsh_repo:
        description: 'DSH 仓库地址（默认官方仓库）'
        required: false
        default: 'https://github.com/deepseek-ai/deepseek-harness.git'
      dsh_version:
        description: 'DSH 分支或标签（默认 master）'
        required: false
        default: 'master'
      proot_rs_url:
        description: 'proot-rs arm64 二进制下载地址（默认官方 v0.1.0 aarch64-android）'
        required: false
        default: 'https://github.com/proot-me/proot-rs/releases/download/v0.1.0/proot-rs-v0.1.0-aarch64-linux-android.tar.gz'
      proot_rs_sha256:
        description: 'proot-rs 二进制 SHA256（可选，建议填写）'
        required: false
        default: ''

jobs:
  # 1. 在原生 arm64 Linux runner 上构建 Debian arm64 RootFS
  #    （用 ubuntu-24.04-arm 而非 x86+qemu：pnpm install/build 需原生 arm64 速度，
  #     这正是 DSH 自身 prebuild 用的 runner）
  build-rootfs:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 安装 RootFS 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap zstd git tar curl xz-utils

      - name: 构建 RootFS（原生 arm64）
        env:
          DSH_REPO: ${{ github.event.inputs.dsh_repo }}
          DSH_VERSION: ${{ github.event.inputs.dsh_version }}
        run: bash rootfs/build_rootfs.sh

      - name: 上传 RootFS 产物
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            build/rootfs/rootfs.tar.zst
            build/rootfs/rootfs_manifest.json
          retention-days: 7

  # 2. 编译并签名 APK
  build-apk:
    needs: build-rootfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取回 RootFS 产物
        uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: build/rootfs/

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fL -o ctl.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q ctl.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: 打包资产（proot-rs + RootFS 分卷）
        env:
          PROOT_RS_URL: ${{ github.event.inputs.proot_rs_url }}
          PROOT_RS_SHA256: ${{ github.event.inputs.proot_rs_sha256 }}
        run: bash packaging/package_assets.sh

      - name: 安装 Gradle 8.9
        run: |
          curl -fL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: 编译 Release APK
        run: gradle assembleRelease --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
